<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PDF Redactor icon</title>
  <desc id="desc">A PDF page with a folded corner and redaction bars.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="430" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="130" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <path d="M143 82h152l84 84v264H143z" fill="#f8fafc"/>
    <path d="M295 82v84h84z" fill="#dbeafe"/>
    <path d="M295 82v84h84" fill="none" stroke="#818cf8" stroke-width="10" stroke-linejoin="round"/>
    <rect x="175" y="132" width="82" height="46" rx="10" fill="#ef4444"/>
    <text x="216" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#fff">PDF</text>
    <rect x="178" y="221" width="190" height="20" rx="10" fill="url(#accent)" opacity=".7"/>
    <rect x="178" y="267" width="142" height="20" rx="10" fill="url(#accent)" opacity=".45"/>
    <rect x="178" y="314" width="196" height="34" rx="7" fill="#020617"/>
    <rect x="178" y="370" width="126" height="34" rx="7" fill="#020617"/>
  </g>
</svg>
